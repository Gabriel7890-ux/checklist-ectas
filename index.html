<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist de Pré-Instalação ECTAS</title>
<meta http-equiv="refresh" content="0; url=https://checklist-ectas.github.io/">
<link rel="canonical" href="https://checklist-ectas.github.io/">
<style>body{font-family:Montserrat,Arial,sans-serif;background:#F3F6F8;color:#1D1D1B;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#0073A8;font-weight:700}</style>
</head>
<body>
<p>O Checklist de Pré-Instalação mudou de endereço.<br>Abrindo <a href="https://checklist-ectas.github.io/">checklist-ectas.github.io</a>…</p>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>{if(k.startsWith("checklist-ectas-"))caches.delete(k);}));}
location.replace("https://checklist-ectas.github.io/"+location.hash);
</script>
</body>
</html>
